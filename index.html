<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Blog Tech</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #243447;
        }

        header {
            background-color: #172b4d;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 19px;
        }

        main {
            max-width: 800px;
            margin: 35px auto;
            padding: 30px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #172b4d;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        .post {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Blog Tech</h1>
        <p>Conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>

        <div class="post">
            <h2>Meu primeiro post</h2>

            <p><strong>Por: Eduarda Moreira Santos</strong></p>

            <p>
                Boas-vindas ao meu novo blog! Aqui vou compartilhar
                dicas de programação, tecnologia e curiosidades
                da área.
            </p>
        </div>

    </main>

</body>

</html>
